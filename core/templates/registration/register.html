{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Регистрация · Freelens{% endblock %}
{% block content %}
<div class="auth-page">
  <section class="auth-card animate-slide-up">
    <div class="text-center mb-6">
      <div class="auth-logo">F</div>
      <h1 class="card-title text-2xl">Регистрация</h1>
      <p class="card-subtitle">Создайте аккаунт для отслеживания заказов.</p>
    </div>

    <div class="form-group">
      {% crispy form %}
    </div>

    <p class="text-center text-sm text-secondary mt-6 mb-0">
      Уже есть аккаунт? <a href="{% url 'core:login' %}" class="font-semibold text-accent-primary">Войти</a>
    </p>
  </section>
</div>
{% endblock %}
